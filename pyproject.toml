[project]
name = "darwin"
version = "2.0.0"
description = "DARWIN v2 — Darwin-Gödel-style evolutionary LoRA-finetuning system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.2",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
