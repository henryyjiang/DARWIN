[project]
name = "darwin"
version = "2.0.0"
description = "DARWIN v2 — Darwin-Gödel-style evolutionary LoRA-finetuning system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.2",
    "anthropic>=0.69",
]

[project.scripts]
darwin = "darwin.run:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# The Claude Agent SDK is only needed to run a live mutation window (§4.5); lazy-imported.
agent = [
    "claude-agent-sdk>=0.1.0",
]
# The local-model backend (§4.6): vLLM serving + the OpenHands harness. GPU-only, lazy-imported;
# the pure config/command builders and the backend contract work without these installed.
local = [
    "vllm>=0.6",
    "openhands-ai>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
