[project]
name = "darwin"
version = "2.0.0"
description = "DARWIN v2 — Darwin-Gödel-style evolutionary LoRA-finetuning system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.2",
    "anthropic>=0.69",
]

[project.scripts]
darwin = "darwin.run:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# The Claude Agent SDK is only needed to run a live mutation window (§4.5); lazy-imported.
agent = [
    "claude-agent-sdk>=0.1.0",
]
# The local-model backend (§4.6): vLLM serving + the OpenHands harness. These are Linux + GPU
# deployment deps, lazy-imported and never touched by the test suite (the pure config/command
# builders and the backend contract work without them). They do NOT support every Python in the
# project's range — notably openhands-ai requires Python >=3.12,<3.14 — so they are gated by
# environment markers to the platform/Python they actually run on. This keeps uv's universal
# resolution satisfiable and lets the Windows/3.14 dev host install + test without them; a Linux
# 3.12/3.13 GPU host installs them with `--extra local`.
local = [
    "vllm>=0.6; sys_platform == 'linux' and python_version >= '3.12' and python_version < '3.14'",
    "openhands-ai>=0.10; sys_platform == 'linux' and python_version >= '3.12' and python_version < '3.14'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
